name: Build Android APK (ScoreTurner)

# 本工作流在 GitHub 云端免费编译出安卓安装包（APK），
# 你本机不需要安装 Android Studio / SDK。
# 触发方式：push 到 main/master 分支，或在 Actions 页点 "Run workflow"。
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖并同步到安卓工程
        run: |
          npm install
          npx cap sync android

      - name: 准备 Android SDK 平台与构建工具
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          yes | "$SDKMANAGER" --licenses

      - name: 编译 debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: scoreturner-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
