name: Build Android APK (ScoreTurner)

# 本工作流在 GitHub 云端免费编译出安卓安装包（APK），
# 你本机不需要安装 Android Studio / SDK。
# 触发方式：push 到 main/master 分支，或在 Actions 页点 "Run workflow"。
on:
  workflow_dispatch:
  push:
    branches: [main, master]

# 允许工作流推送日志分支（新仓库 GITHUB_TOKEN 默认只读，必须显式声明）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 安装 Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安装依赖并同步到安卓工程
        run: |
          npm install
          npx cap sync android

      - name: 准备 Android SDK 平台与构建工具
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          yes | "$SDKMANAGER" --licenses

      - name: 编译 debug APK
        id: build
        working-directory: android
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon 2>&1 | tee /tmp/gradle.log

      - name: 发布构建日志供排查
        if: always()
        run: |
          mkdir -p cilog
          cp /tmp/gradle.log cilog/gradle.log 2>/dev/null || echo "(no gradle log)" > cilog/gradle.log
          cp android/build.gradle cilog/top-build.gradle 2>/dev/null
          cp android/app/build.gradle cilog/app-build.gradle 2>/dev/null
          cp android/gradle/wrapper/gradle-wrapper.properties cilog/gradle-wrapper.properties 2>/dev/null
          cp android/local.properties cilog/local.properties 2>/dev/null || true
          git config user.email "ci@local"
          git config user.name "CI"
          git checkout -B ci-logs
          git add -A cilog
          git commit -m "ci build log" || true
          git push -f origin ci-logs

      - name: 上传 APK 产物
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: scoreturner-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
